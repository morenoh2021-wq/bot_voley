<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLEY BINACED</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh; 
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
        h1 { font-size: 1.4rem; color: #1e3c72; text-align: center; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { font-size: 0.9rem; color: #666; text-align: center; margin-bottom: 20px; }
        
        .player-card { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 8px; 
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }
        
        /* Estados de color para NOMBRE Y APELLIDO */
        .player-name { font-size: 1.05rem; font-weight: 600; color: #333; flex-grow: 1; padding-right: 10px; }
        .player-card.confirmed-yes .player-name { color: #27ae60 !important; }
        .player-card.confirmed-no .player-name { color: #c0392b !important; text-decoration: line-through; opacity: 0.7; }
        
        .btn-group { display: flex; gap: 8px; shrink: 0; }
        .btn { 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-yes { background-color: #e8f8f0; color: #2e7d32; border: 1px solid #a3e2bc; }
        .btn-no { background-color: #fdeadc; color: #c62828; border: 1px solid #f5b7b1; }
        
        /* Botones cuando ya están activos */
        .player-card.confirmed-yes .btn-yes { background-color: #27ae60; color: white; border-color: #27ae60; }
        .player-card.confirmed-no .btn-no { background-color: #c0392b; color: white; border-color: #c0392b; }
        
        .actions { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .btn-main { background: #2a5298; color: white; padding: 14px; border-radius: 10px; font-size: 1rem; border: none; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
        .btn-danger { background: #f2dede; color: #a94442; padding: 10px; border-radius: 8px; font-size: 0.9rem; border: 1px solid #ebccd1; width: 100%; cursor: pointer; font-weight: bold; }
        .counter { text-align: center; font-weight: bold; color: #2a5298; margin-top: 15px; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏐 VOLEY BINACED 🏐</h1>
    <div class="subtitle">¿Quién juega este martes? Selecciona tu opción:</div>

    <div id="lista-jugadores">
        <!-- Aquí tu app.py cargará dinámicamente la plantilla -->
        {% for jugador in plantilla %}
        <div class="player-card {% if jugador.status == 'si' %}confirmed-yes{% elif jugador.status == 'no' %}confirmed-no{% endif %}">
            <div class="player-name">{{ jugador.nombre }} <span style="font-size:0.8rem; color:#888;">({{ jugador.rol }})</span></div>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="marcar('{{ jugador.nombre }}', 'si')">SÍ</button>
                <button class="btn btn-no" onclick="marcar('{{ jugador.nombre }}', 'no')">NO</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="counter">
        Confirmados: <span id="total">{{ total_confirmados }}</span> jug.
    </div>

    <div class="actions">
        <button class="btn-main" onclick="balancear()">⚡ Balancear Niveles y Enviar ⚡</button>
        <button class="btn-danger" onclick="vaciar()">Vaciar Lista (Reset semanal)</button>
    </div>
</div>

<script>
    function marcar(nombre, opcion) {
        fetch('/marcar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ nombre: nombre, opcion: opcion })
        }).then(() => location.reload());
    }
    function balancear() { fetch('/balancear').then(() => alert('¡Equipos enviados a WhatsApp!')); }
    function vaciar() { if(confirm('¿Seguro que quieres vaciar la lista?')) { fetch('/vaciar').then(() => location.reload()); } }
</script>

</body>
</html>
